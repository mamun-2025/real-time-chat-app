
{% extends 'base.html' %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white shadow-lg rounded-lg p-8 mt-10">
   <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Create an Account</h2>
   
   <form method="POST" class="space-y-4">
      {% csrf_token %}

      {% for field in form %}
         <div>
            <label class="block text-gray-700 font-bold mb-2">{{ field.label }}</label>
            {{ field }} 
            {% if field.errors %}
                  <p class="text-red-500 text-xs italic">{{ field.errors }}</p>
            {% endif %}
         </div>
      {% endfor %}

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition">
         Sign up
      </button>

      <p class="text-center text-gray-600 text-sm">
         Already have an account? <a href="{% url 'login' %}" class="text-blue-500 hover:underline">Login here</a>
      </p>
   </form>
</div>
{% endblock %}
