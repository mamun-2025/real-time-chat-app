
{% extends 'base.html' %}
{% block title %}Sign Up{% endblock %}

{% block conent %}
<div class="max-w-md mx-auto p6 bg-white rounded shadow">
   <h2 class="text-2xl font-bold mb-4 text-center">Sign Up</h2>
   <form method="POST" class="space-y-4">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="w-full bg-blue-500 text-white px-4 py-2 rounded ">Signup</button>
   </form>
   <p class="mt-4 text-center text-gray-600">
      Already have an account?
      <a href="{% url 'login' %}" class="text-blue-500">
         Login here
      </a>
   </p>
</div>

{% endblock %}
